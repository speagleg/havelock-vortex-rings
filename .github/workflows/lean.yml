name: lean
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    # Private-repo ubuntu-latest runners have 2 CPUs and 8 GB of RAM. scripts/build_lean.sh builds the modules
    # ONE AT A TIME, in dependency order: a plain parallel `lake build` would check several large modules at once
    # and can run out of memory.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failing command is not masked by `tee`
    steps:
      - uses: actions/checkout@v4
      - name: Check no sorry / admit / native_decide / axiom (comments excluded)
        run: python3 .github/scripts/check_no_sorry.py lean
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Mathlib build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
      - name: Fetch Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build (one module at a time)
        run: |
          free -h
          bash scripts/build_lean.sh --list
          bash scripts/build_lean.sh
      - name: Axiom gate
        working-directory: lean
        run: |
          lake env lean AxiomAudit.lean 2>&1 | tee axioms.log
          bash ../.github/scripts/check_axioms.sh axioms.log AxiomAudit.lean
