[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "havelock"
version = "0.1.0"
description = "Stability thresholds, nonlinear verdicts, simulations and certificates for regular N-vortex rings"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Gordon Speagle", email = "gspeagle@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["point vortices", "vortex rings", "stability", "hyperbolic plane", "computer-assisted proof"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# Floors: the oldest releases with every API the package uses; the CI job `floor` runs the test suite with exactly
# these versions on Python 3.10. Also tested with: mpmath 1.3.0, sympy 1.14.0, numpy 2.5.3, scipy 1.18.1,
# python-flint 0.9.0 (requirements.txt).
dependencies = ["mpmath>=1.3", "sympy>=1.12", "numpy>=1.24", "scipy>=1.10", "python-flint>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/speagleg/havelock-vortex-rings"
Documentation = "https://github.com/speagleg/havelock-vortex-rings/blob/main/docs/quickstart.md"

[project.scripts]
havelock = "havelock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
